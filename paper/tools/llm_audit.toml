[[item]]
id = 'R08'
find = '''Table~\ref{tab:nonlinearity-comparison} summarizes the trade-offs between exactness, completeness, and computational cost across existing invariant pooling layers. Norm pooling and gated nonlinearities are exact invariants but \emph{incomplete}. Fourier-space pointwise nonlinearities are equivariant rather than invariant, still need an incomplete pooling step, and lose exact equivariance through \mbox{aliasing~\citep{weiler2019general}}. The full bispectrum is exact and complete but costs $O(|G|^2)$ coefficients. The \emph{selective} bispectrum (Section~\ref{sec:background}) preserves both exactness and completeness while using only $O(|G|)$ coefficients on generic signals.'''
note = '''The paragraph restates Table 1 as a parallel ladder (``X are exact but incomplete ... The full bispectrum is exact and complete but ... The selective bispectrum preserves both ...''), opened by the tricolon ``exactness, completeness, and computational cost''. (A) one sentence: ``Table 1 compares these layers; only the selective bispectrum is complete with $O(|G|)$ coefficients.'' (B) keep only the last sentence. (C) keep.'''

