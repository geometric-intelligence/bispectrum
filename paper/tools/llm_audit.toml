# LLM-style audit catalogue for paper/bispectrum.tex and paper/checklist.tex.
#
# id          category letter + number (+ instance letter): V vocabulary, R rhetorical tics,
#             J code-speak/jargon, D duplication, S signposting, H hedges, C captions/headers,
#             M mechanical drift, X deferred to the SO(3) completeness pass
# kind        span (wrap the text in \llm) or point (insert \llmpt after the anchor)
# file        bispectrum.tex (default) or checklist.tex
# find        exact source text, whitespace-insensitive; before[[target]]after marks the
#             target inside a longer context (for a point, the insertion is at ]])
# occurrence  1-based index when find matches more than once
# note        problem and alternatives; no %, #, &, \cite or \ref

