[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bispectrum"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build]
include = [
    "src/bispectrum/**/*.py",
]

[project]
name = "bispectrum"
version = "0.3.6"
description = "Bispectrum analysis for machine learning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Johan Mathe", email = "johan.mathe@gmail.com" }]
keywords = [
    "deep learning",
    "neural networks",
    "tensor manipulation",
    "machine learning",
    "scientific computations",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "torch>=2.10",
  "numpy>=1.22.4",
  "torch-harmonics>=0.9",
]

optional-dependencies.dev = [
  "pytest>=8",
  "pytest-cov>=4.0.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.4.0",
  "mypy>=1.5.0",
  "pre-commit>=3.3.3",
]
optional-dependencies.experiments = [
  "matplotlib>=3.7.0",
  "scipy>=1.10",
  "torchvision",
  "h5py",
  "medmnist",
]

urls.Homepage = "https://github.com/geometric-intelligence/bispectrum"
urls.Repository = "https://github.com/geometric-intelligence/bispectrum"
urls.Issues = "https://github.com/geometric-intelligence/bispectrum/issues"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901", "E741"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

# torch_harmonics has no py.typed marker; treat as untyped.
[[tool.mypy.overrides]]
module = "torch_harmonics.*"
ignore_missing_imports = true

# nn.Module.register_buffer registers attributes as Tensor | Module in the
# torch stubs, which forces a wall of false-positive index/operator/arg-type
# errors at every buffer access. torch.special / torch.* return Any in the
# stubs, triggering no-any-return everywhere. Disable those codes per-module
# rather than papering the source with type: ignore comments.
[[tool.mypy.overrides]]
module = [
  "bispectrum.so3_on_s2",
  "bispectrum.so2_on_disk",
  "bispectrum.octa_on_octa",
  "bispectrum.dn_on_dn",
  "bispectrum.torus_on_torus",
  "bispectrum.cn_on_cn",
  "bispectrum.rotation",
  "bispectrum._bessel",
  "bispectrum._cg",
]
disable_error_code = ["index", "operator", "arg-type", "no-untyped-call", "no-any-return"]

[tool.coverage.run]
source = ["src/bispectrum"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
